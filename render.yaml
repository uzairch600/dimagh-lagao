# Render Blueprint: Render > New > Blueprint > pick this repo. Creates the live web service.
# The secret DATABASE_URL is not in this file: Render asks for it when the Blueprint is applied.
services:
  - type: web
    name: dimagh-lagao
    runtime: node
    # A free service sleeps after 15 idle minutes, so an outside uptime
    # monitor pings /api/config every 10 minutes to keep it awake (one always-on service fits the free 750 h/month).
    plan: free
    region: singapore # closest Render region to Pakistan
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
